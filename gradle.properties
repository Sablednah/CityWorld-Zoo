# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled for now; some ModDevGradle run tasks interact poorly with it.
org.gradle.configuration-cache=false

# Parchment provides human-readable parameter names/javadocs. Optional.
parchment_minecraft_version=
parchment_mappings_version=

# Environment Properties
# What we BUILD against (one exact build) vs what the jar RUNS on (a range).
# Keep the distinction: a range pinned to the build strands users on an earlier patch for no reason.
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.72
# Any build in the 26.2 series. The ZARP pack runs 26.2.0.88.
neo_version_range=[26.2,26.3)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

# Dev server port, one pair per project in the family (Chronicler's CLAUDE.md has the table).
# Sable assigned 25575 on 2026-10-12. RCON is 25585 and lives in run-mc26.2/server.properties
# (gitignored), so a fresh checkout sets it by hand.
dev_server_port=25575

## Mod Properties
mod_id=cityworld_zoo
mod_name=CityWorld: Zoo
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.sablednah.cityworldzoo
mod_authors=Sablednah
mod_description=Zoo animals from zombie media: giraffe, rhesus macaque, zebra, deer, lion, tiger, elephant and brown bear. Spawn eggs, breeding, and a datapack that fills CityWorld's zoos with them. CityWorld optional.
