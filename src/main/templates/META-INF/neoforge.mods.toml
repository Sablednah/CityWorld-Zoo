# CityWorld: Zoo — neoforge.mods.toml (values are expanded from gradle.properties at build time).
# EDIT THIS TEMPLATE, never the generated copy under build/.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Sablednah/CityWorld-Zoo/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
displayURL="https://sablecraft.co.uk/cityworld-zoo/"
# Older loaders ignore keys they do not know: iconFile is the small square beside the name (26.2+),
# bannerFile the wide info-panel image (26.2+), logoFile what 1.21.x and 26.1 show and 26.2's fallback.
# cityworld_zoo-icon.png is the 256 square (docs/logo.png), cityworld_zoo.png the 850 wordmark (docs/).
iconFile="cityworld_zoo-icon.png"
bannerFile="cityworld_zoo.png"
logoFile="cityworld_zoo.png"
logoBlur=false

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# CityWorld reads this jar's data/cityworld_zoo/cityworld/zoo/{animal,habitat} as datapack registries
# (CityWorld 6.3.0+, "Zoos are data"). Nothing here imports CityWorld's code, so the relation is
# informational: without CityWorld the animals still exist, through spawn eggs.
[[dependencies.${mod_id}]]
    modId="cityworld"
    type="optional"
    versionRange="[1,)"
    ordering="NONE"
    side="BOTH"
